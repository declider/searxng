# SearXNG — Windows-native settings template.
# run.cmd copies this to settings.yml on first launch and fills in a secret key.
use_default_settings: true

general:
  debug: false

search:
  # JSON output, for API clients (agents, MCP servers, scripts, ...).
  formats:
    - html
    - json

server:
  bind_address: "127.0.0.1"
  port: 8888
  # Placeholder — run.cmd replaces this with a freshly generated key.
  secret_key: "CHANGE-ME"
  # limiter/bot-detection needs a valkey server; disabled for the local single-user case.
  limiter: false
  image_proxy: false
